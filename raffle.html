<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raffle Draw</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<!--
    The contest draw, on its own, for a shared screen.

    Nothing on this page decides anything. The tickets come from the same
    month the Contest panel saves to cloud storage, and the winner comes from
    contest.drawWinner, so the rules (tickets squared, nobody twice) live in
    one place. This page only makes the moment fun.

    It reads the sync settings the app keeps in this browser, so it works on
    the computer the Coaching Tool is used on. Nothing is written anywhere:
    who has been drawn, and who was taken out of the raffle with the x, rides
    scrambled in the address (?sitting=...) so a refresh keeps the sitting.
    Out of this round only puts their tickets back, so it leaves nothing to
    remember. Nobody taken out is ever shown, so a screenshot shows winners.
-->
<style>
    :root {
        --bg-1: #2a0f5c;
        --bg-2: #0b1030;
        --gold-1: #fff1b8;
        --gold-2: #ffc93d;
        --gold-3: #ff9f1c;
        --ink: #3b1d00;
        --ink-soft: #7a4a0c;
        --pink: #ff3d7f;
        --orange: #ff8a00;
        --text: #ffffff;
        --text-soft: rgba(255, 255, 255, 0.72);
        --chip: rgba(255, 255, 255, 0.10);
        --stamp: #d7193f;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
        background: radial-gradient(ellipse at 50% 35%, var(--bg-1) 0%, var(--bg-2) 70%) fixed, var(--bg-2);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* Slow light rays behind everything. */
    .rays {
        position: fixed;
        left: 50%;
        top: 42%;
        width: 220vmax;
        height: 220vmax;
        margin: -110vmax 0 0 -110vmax;
        background: repeating-conic-gradient(from 0deg, rgba(255, 214, 102, 0.07) 0deg 7deg, transparent 7deg 18deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 45%);
        mask-image: radial-gradient(circle, #000 0%, transparent 45%);
        animation: spin 90s linear infinite;
        pointer-events: none;
        z-index: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
    }

    main {
        position: relative;
        z-index: 2;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px 40px;
        text-align: center;
    }

    .eyebrow {
        font-size: clamp(0.9rem, 1.6vw, 1.15rem);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold-2);
    }

    h1 {
        margin: 6px 0 4px;
        font-family: "Segoe UI Black", "Arial Black", "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(2rem, 5.5vw, 3.8rem);
        line-height: 1.05;
        text-shadow: 0 4px 24px rgba(255, 61, 127, 0.45);
    }

    .pool {
        margin: 0 0 28px;
        min-height: 1.5em;
        font-size: clamp(1rem, 1.8vw, 1.25rem);
        color: var(--text-soft);
    }

    /* ---------- The ticket ---------- */

    .ticket-wrap {
        position: relative;
        width: min(920px, 100%);
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
    }

    .ticket {
        position: relative;
        display: flex;
        min-height: clamp(190px, 26vw, 270px);
        border-radius: 18px;
        background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-2) 45%, var(--gold-3) 100%);
        color: var(--ink);
        /* Half-circle bites out of both ends, like a real raffle ticket. */
        -webkit-mask:
            radial-gradient(circle at 0 50%, transparent 22px, #000 23px) left / 51% 100% no-repeat,
            radial-gradient(circle at 100% 50%, transparent 22px, #000 23px) right / 51% 100% no-repeat;
        mask:
            radial-gradient(circle at 0 50%, transparent 22px, #000 23px) left / 51% 100% no-repeat,
            radial-gradient(circle at 100% 50%, transparent 22px, #000 23px) right / 51% 100% no-repeat;
    }

    /* A sheen that sweeps across while the names roll. */
    .ticket::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%);
        transform: translateX(-120%);
        pointer-events: none;
    }
    body.spinning .ticket::after { animation: sheen 1.1s ease-in-out infinite; }
    .ticket-wrap.won .ticket::after { animation: sheen 0.9s ease-out 1; }

    @keyframes sheen { to { transform: translateX(120%); } }

    .stub {
        flex: 0 0 clamp(64px, 11vw, 112px);
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 3px dashed rgba(59, 29, 0, 0.35);
    }

    .stub span {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-family: "Segoe UI Black", "Arial Black", system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(0.8rem, 1.6vw, 1.15rem);
        letter-spacing: 0.28em;
        color: var(--ink-soft);
    }

    .face {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 18px clamp(28px, 5vw, 56px);
    }

    .label {
        font-size: clamp(0.85rem, 1.6vw, 1.1rem);
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-soft);
    }

    .window {
        width: 100%;
        overflow: hidden;
        margin: 6px 0 4px;
        padding: 4px 0;
    }

    .name {
        display: inline-block;
        white-space: nowrap;
        font-family: "Segoe UI Black", "Arial Black", "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        font-size: 72px;
        line-height: 1.15;
        color: var(--ink);
    }
    .name.flip { animation: flip 120ms ease-out; }

    @keyframes flip {
        from { transform: translateY(-55%); opacity: 0.2; }
        to { transform: translateY(0); opacity: 1; }
    }

    .count {
        min-height: 1.4em;
        font-size: clamp(1rem, 2vw, 1.4rem);
        font-weight: 800;
        color: var(--ink-soft);
    }

    .won-with {
        min-height: 1.3em;
        margin-top: 2px;
        font-size: clamp(0.95rem, 1.7vw, 1.2rem);
        font-weight: 700;
        color: var(--ink-soft);
    }
    .won-with:not(:empty) { animation: rise 400ms ease-out 500ms both; }

    .stamp {
        position: absolute;
        right: clamp(18px, 4vw, 46px);
        top: clamp(10px, 2vw, 22px);
        padding: 4px 14px;
        border: 5px solid var(--stamp);
        border-radius: 10px;
        font-family: "Segoe UI Black", "Arial Black", system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(1rem, 2.4vw, 1.7rem);
        letter-spacing: 0.12em;
        color: var(--stamp);
        opacity: 0;
        transform: rotate(-12deg) scale(2.6);
        pointer-events: none;
    }
    .ticket-wrap.won .stamp { animation: stamp 420ms cubic-bezier(0.2, 1.4, 0.4, 1) 250ms forwards; }
    .ticket-wrap.won { animation: pop 600ms ease-out; }

    @keyframes stamp {
        to { opacity: 0.88; transform: rotate(-12deg) scale(1); }
    }

    @keyframes pop {
        0% { transform: scale(1); }
        35% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }

    /* ---------- The button ---------- */

    .go {
        margin-top: 34px;
        padding: 18px 46px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--pink), var(--orange));
        color: #fff;
        font-family: "Segoe UI Black", "Arial Black", "Segoe UI", system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(1.2rem, 2.4vw, 1.6rem);
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(255, 61, 127, 0.45), inset 0 -4px 0 rgba(0, 0, 0, 0.15);
        transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    }
    .go:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 36px rgba(255, 61, 127, 0.55), inset 0 -4px 0 rgba(0, 0, 0, 0.15); }
    .go:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
    .go:disabled { opacity: 0.45; cursor: default; }
    .go:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 4px; }

    /* ---------- Winners so far ---------- */

    .winners {
        list-style: none;
        margin: 30px 0 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        max-width: 920px;
    }

    .winners li {
        position: relative;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--chip);
        border: 1px solid rgba(255, 201, 61, 0.35);
        color: var(--gold-1);
        font-weight: 700;
        font-size: clamp(0.9rem, 1.5vw, 1.05rem);
        animation: rise 400ms ease-out;
    }

    /* The x sits on the chip's corner and only shows with the mouse on the
       chip, so the screen the room sees stays clean. */
    .winners .skip {
        position: absolute;
        top: -9px;
        right: -9px;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--stamp);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: opacity 120ms ease-out;
    }
    .winners li:hover .skip, .winners li.choosing .skip, .winners .skip:focus-visible { opacity: 1; outline: none; }
    @media (hover: none) { .winners .skip { opacity: 1; } }
    body.spinning .winners .skip { opacity: 0; pointer-events: none; }

    /* The two ways out the x offers. */
    .winners .choice {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border-radius: 14px;
        background: #1d1446;
        border: 1px solid rgba(255, 201, 61, 0.35);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
        white-space: nowrap;
    }
    .winners .choice button {
        display: block;
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
    }
    .winners .choice button:hover, .winners .choice button:focus-visible { background: rgba(255, 255, 255, 0.18); outline: none; }
    .winners .choice small { display: block; margin-top: 2px; font-weight: 400; font-size: 0.8rem; color: var(--text-soft); }

    @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
    }

    .sound {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 6;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        font-size: 1.2rem;
        cursor: pointer;
        opacity: 0.55;
    }
    .sound:hover, .sound:focus-visible { opacity: 1; }

    @media (max-width: 560px) {
        .stub { display: none; }
        .stamp { top: 8px; right: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .rays, body.spinning .rays { animation: none; }
        body.spinning .ticket::after, .ticket-wrap.won .ticket::after { animation: none; }
        .ticket-wrap.won { animation: none; }
        .name.flip { animation: none; }
    }
</style>
</head>
<body>
    <div class="rays" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <button type="button" id="sound" class="sound" aria-label="Sound is on" title="Sound">🔊</button>

    <main>
        <div class="eyebrow">🎟️ Raffle 🎟️</div>
        <h1 id="title">Raffle Draw</h1>
        <p id="pool" class="pool">Getting the tickets...</p>

        <div class="ticket-wrap" id="ticketWrap">
            <div class="ticket">
                <div class="stub"><span>LUCKY TICKET</span></div>
                <div class="face">
                    <div class="label" id="label">Who's it going to be?</div>
                    <div class="window" id="window"><div class="name" id="name">?</div></div>
                    <div class="count" id="count" aria-live="polite"></div>
                    <div class="won-with" id="wonWith"></div>
                </div>
            </div>
            <div class="stamp" aria-hidden="true">WINNER</div>
        </div>

        <button type="button" id="go" class="go" disabled>🎲 Draw a winner</button>
        <ul id="winners" class="winners" aria-label="Winners so far"></ul>
    </main>

<script>
(function () {
    'use strict';

    var SYNC_KEY = 'devCoachingTool_callListeningSyncConfig';
    var DEFAULT_ENDPOINT = 'https://dev-coaching-sync.scottk.workers.dev';
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
    var CONFETTI = ['#ffc93d', '#ff3d7f', '#22d3ee', '#a78bfa', '#34d399', '#ffffff', '#ff8a00'];
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var el = function (id) { return document.getElementById(id); };
    var title = el('title'), pool = el('pool'), label = el('label'), nameEl = el('name'),
        windowEl = el('window'), count = el('count'), wonWith = el('wonWith'), go = el('go'), wrap = el('ticketWrap'),
        winnersEl = el('winners'), soundBtn = el('sound');

    var monthData = null;
    var drawn = [];
    var spinning = false;
    var onTicket = '';
    var monthKey = '';
    // Out of this round only: left out of the one redraw, then back in the bowl.
    var sittingOut = '';
    // Out of the raffle: still in drawn, never on screen, kept for the address.
    var outOfRaffle = [];
    // The chip whose two choices are open, if any.
    var choosing = null;

    // ============================================
    // MONTHS
    // ============================================

    function keyOf(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
    }

    function shift(key, by) {
        var parts = key.split('-').map(Number);
        return keyOf(new Date(parts[0], parts[1] - 1 + by, 1));
    }

    function labelOf(key) {
        var parts = key.split('-').map(Number);
        return MONTHS[parts[1] - 1] + ' ' + parts[0];
    }

    // ?month=2026-09 picks the month. Without it, the first week of a month
    // draws last month, since that is when a month's draw happens, and either
    // way an empty month falls back to the other one.
    function monthsToTry() {
        var asked = new URLSearchParams(window.location.search).get('month');
        if (/^\d{4}-\d{2}$/.test(asked || '')) return [asked];
        var now = new Date();
        var current = keyOf(now);
        var last = shift(current, -1);
        return now.getDate() <= 7 ? [last, current] : [current, last];
    }

    // ============================================
    // TICKETS
    // ============================================

    function syncConfig() {
        try {
            var saved = JSON.parse(window.localStorage.getItem(SYNC_KEY) || '{}') || {};
            return {
                endpoint: typeof saved.endpoint === 'string' && saved.endpoint ? saved.endpoint : DEFAULT_ENDPOINT,
                secret: typeof saved.sharedSecret === 'string' ? saved.sharedSecret : ''
            };
        } catch (e) {
            return { endpoint: DEFAULT_ENDPOINT, secret: '' };
        }
    }

    function fetchMonth(key) {
        var config = syncConfig();
        var headers = { 'Content-Type': 'application/json' };
        if (config.secret) headers['x-sync-secret'] = config.secret;
        return fetch(config.endpoint, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ mode: 'contestGet', month: key })
        }).then(function (response) {
            return response.json().catch(function () { return null; }).then(function (data) {
                if (!response.ok || !data || !data.ok) {
                    var error = new Error((data && data.error) || ('HTTP ' + response.status));
                    error.status = response.status;
                    throw error;
                }
                var month = (data.data && typeof data.data === 'object') ? data.data : { days: {} };
                if (!month.days) month.days = {};
                return month;
            });
        });
    }

    function contest() {
        return window.DevCoachModules && window.DevCoachModules.contest;
    }

    function board() {
        return contest().buildLeaderboard(monthData).filter(function (row) {
            return drawn.indexOf(row.associate) === -1 && row.associate !== sittingOut;
        });
    }

    function ticketsLeft() {
        return board().reduce(function (sum, row) { return sum + row.total; }, 0);
    }

    function plural(n, one, many) {
        return n.toLocaleString('en-US') + ' ' + (n === 1 ? one : many);
    }

    function showPool() {
        var left = ticketsLeft();
        if (!left) {
            pool.textContent = drawn.length ? 'Every ticket has been drawn.' : 'No tickets in the bowl yet.';
            return;
        }
        var people = board().length;
        pool.textContent = drawn.length
            ? plural(left, 'ticket', 'tickets') + ' left in the bowl'
            : plural(left, 'ticket', 'tickets') + ' in the bowl from ' + plural(people, 'person', 'people') + '. More tickets, better odds!';
    }

    // ============================================
    // THE NAME IN THE WINDOW
    // ============================================

    // Long names shrink to fit the ticket rather than running off it.
    function setName(text, animate, ms) {
        nameEl.textContent = text;
        nameEl.style.fontSize = '';
        var room = windowEl.clientWidth;
        var base = Math.min(84, Math.max(34, room / 9));
        nameEl.style.fontSize = base + 'px';
        if (nameEl.scrollWidth > room) {
            nameEl.style.fontSize = Math.floor(base * room / nameEl.scrollWidth) + 'px';
        }
        if (animate && !reduced) {
            nameEl.style.animationDuration = Math.max(60, Math.min(ms * 0.85, 220)) + 'ms';
            nameEl.classList.remove('flip');
            void nameEl.offsetWidth;
            nameEl.classList.add('flip');
        }
    }

    // What flashes past before the winner lands. Drawn in proportion to each
    // person's chances, so the people holding the most tickets flash past the
    // most, which is how the real odds look. Only the last name is the draw.
    function reel(winner, steps) {
        var rows = board();
        var weights = rows.map(function (row) { return row.total * row.total; });
        var total = weights.reduce(function (a, b) { return a + b; }, 0);
        var names = [];
        var previous = '';
        for (var i = 0; i < steps - 1; i += 1) {
            var pick = previous;
            for (var tries = 0; tries < 6 && (pick === previous || (i === steps - 2 && pick === winner)); tries += 1) {
                var r = Math.random() * total;
                for (var k = 0; k < rows.length; k += 1) {
                    r -= weights[k];
                    if (r < 0) { pick = rows[k].associate; break; }
                }
            }
            names.push(pick);
            previous = pick;
        }
        names.push(winner);
        return names;
    }

    // ============================================
    // SOUND
    // ============================================

    var audio = null;
    var master = null;
    var soundOn = true;

    // Made on the first click, which browsers require before a page may make
    // a sound, and resumed every time in case the browser started it paused.
    // Everything runs through a compressor so it can be loud without crackling.
    function audioContext() {
        if (!audio) {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            audio = new Ctx();
            var squash = audio.createDynamicsCompressor();
            master = audio.createGain();
            master.gain.value = 0.9;
            master.connect(squash);
            squash.connect(audio.destination);
        }
        if (audio.state === 'suspended' && audio.resume) audio.resume();
        return audio;
    }

    function tone(freq, length, volume, type, delay, lowpass) {
        var a = soundOn && audioContext();
        if (!a) return;
        var at = a.currentTime + (delay || 0) + 0.02;
        var osc = a.createOscillator();
        var gain = a.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(volume, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + length);
        osc.connect(gain);
        var out = gain;
        if (lowpass) {
            var filter = a.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = lowpass;
            gain.connect(filter);
            out = filter;
        }
        out.connect(master);
        osc.start(at);
        osc.stop(at + length + 0.05);
    }

    // A splash of filtered noise under the last chord, like a cymbal.
    function cymbal(delay) {
        var a = soundOn && audioContext();
        if (!a) return;
        var length = 1.4;
        var buffer = a.createBuffer(1, Math.floor(a.sampleRate * length), a.sampleRate);
        var data = buffer.getChannelData(0);
        for (var i = 0; i < data.length; i += 1) data[i] = Math.random() * 2 - 1;
        var source = a.createBufferSource();
        source.buffer = buffer;
        var highpass = a.createBiquadFilter();
        highpass.type = 'highpass';
        highpass.frequency.value = 6000;
        var gain = a.createGain();
        var at = a.currentTime + (delay || 0) + 0.02;
        gain.gain.setValueAtTime(0.4, at);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + length);
        source.connect(highpass);
        highpass.connect(gain);
        gain.connect(master);
        source.start(at);
        source.stop(at + length);
    }

    function tick() { tone(1700 + Math.random() * 300, 0.045, 0.4, 'square', 0, 4500); }

    function fanfare() {
        var notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach(function (f, i) { tone(f, 0.26, 0.45, 'sawtooth', i * 0.11, 2800); });
        notes.forEach(function (f) { tone(f, 1.5, 0.25, 'sawtooth', 0.46, 2400); });
        cymbal(0.46);
    }

    // Turning the sound on plays a ding, so it can be checked before the
    // meeting without drawing anybody.
    soundBtn.addEventListener('click', function () {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
        soundBtn.setAttribute('aria-label', soundOn ? 'Sound is on' : 'Sound is off');
        if (soundOn) {
            tone(1046.5, 0.5, 0.45, 'triangle');
            tone(1568, 0.6, 0.3, 'triangle', 0.12);
        }
    });

    // ============================================
    // CONFETTI
    // ============================================

    var canvas = el('confetti');
    var ctx2d = canvas.getContext('2d');
    var bits = [];
    var running = false;

    function sizeCanvas() {
        var ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * ratio);
        canvas.height = Math.floor(window.innerHeight * ratio);
        ctx2d.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    window.addEventListener('resize', sizeCanvas);
    sizeCanvas();

    function piece(x, y, vx, vy) {
        return {
            x: x, y: y, vx: vx, vy: vy,
            w: 7 + Math.random() * 8, h: 4 + Math.random() * 6,
            rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.35,
            wobble: Math.random() * Math.PI * 2,
            round: Math.random() < 0.25,
            color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)],
            age: 0, life: 180 + Math.random() * 90
        };
    }

    // Two poppers from the bottom corners, aimed up and in, so the name in
    // the middle of the ticket stays readable while the paper flies.
    function celebrate() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var perSide = reduced ? 25 : 110;
        [{ x: 0, dir: 1 }, { x: w, dir: -1 }].forEach(function (side) {
            for (var i = 0; i < perSide; i += 1) {
                var angle = (55 + Math.random() * 30) * Math.PI / 180;
                var speed = (h / 34) * (0.7 + Math.random() * 0.6);
                bits.push(piece(side.x, h + 10, Math.cos(angle) * speed * side.dir, -Math.sin(angle) * speed));
            }
        });
        if (!reduced) {
            for (var j = 0; j < 140; j += 1) {
                bits.push(piece(Math.random() * window.innerWidth, -20 - Math.random() * window.innerHeight * 0.6,
                    (Math.random() - 0.5) * 2, 2 + Math.random() * 3));
            }
        }
        if (!running) { running = true; requestAnimationFrame(frame); }
    }

    function frame() {
        ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight);
        bits = bits.filter(function (b) { return b.age < b.life && b.y < window.innerHeight + 40; });
        bits.forEach(function (b) {
            b.age += 1;
            b.vx *= 0.985;
            b.vy = b.vy * 0.985 + 0.32;
            b.wobble += 0.12;
            b.x += b.vx + Math.sin(b.wobble) * 0.8;
            b.y += b.vy;
            b.rot += b.spin;
            ctx2d.save();
            ctx2d.globalAlpha = Math.min(1, (b.life - b.age) / 40);
            ctx2d.translate(b.x, b.y);
            ctx2d.rotate(b.rot);
            ctx2d.fillStyle = b.color;
            if (b.round) {
                ctx2d.beginPath();
                ctx2d.arc(0, 0, b.h / 2 + 1, 0, Math.PI * 2);
                ctx2d.fill();
            } else {
                ctx2d.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.wobble)) + 1);
            }
            ctx2d.restore();
        });
        if (bits.length) requestAnimationFrame(frame);
        else { running = false; ctx2d.clearRect(0, 0, window.innerWidth, window.innerHeight); }
    }

    // ============================================
    // THE DRAW
    // ============================================

    function draw() {
        if (spinning || !monthData || !contest()) return;
        closeChoice();
        var result = contest().drawWinner(monthData, undefined, { exclude: drawn.concat(sittingOut ? [sittingOut] : []) });
        if (!result) return;

        spinning = true;
        go.disabled = true;
        document.body.classList.add('spinning');
        wrap.classList.remove('won');
        label.textContent = 'Drawing...';
        count.textContent = '';
        wonWith.textContent = '';
        nameEl.removeAttribute('title');

        var steps = reduced ? 8 : 36;
        var names = reel(result.associate, steps);
        var i = 0;

        function next() {
            var progress = i / (steps - 1);
            // Fast at first, then slowing right down into the last few names.
            var ms = reduced ? 220 : 45 + Math.pow(progress, 3) * 520;
            setName(names[i], true, ms);
            tick();
            i += 1;
            if (i < steps) setTimeout(next, ms);
            else setTimeout(land, Math.max(ms, 300));
        }

        function land() {
            drawn.push(result.associate);
            document.body.classList.remove('spinning');
            label.textContent = 'And the winner is';
            setName(result.associate, false);
            onTicket = result.associate;
            count.textContent = '🎟️ ' + plural(result.entriesHeld, 'ticket', 'tickets');
            if (result.wonWith) {
                wonWith.textContent = (result.reason === 'perfect-survey' ? '⭐' : '⏰')
                    + ' Winning ticket: ' + result.wonWith;
            }
            // The check, for anyone who hovers: same numbers the Contest panel shows.
            nameEl.title = 'Drew chance ' + (result.draw + 1).toLocaleString('en-US') + ' of '
                + result.chances.toLocaleString('en-US') + '. '
                + plural(result.entriesHeld, 'ticket', 'tickets') + ' worth '
                + plural(result.chancesHeld, 'chance', 'chances') + '.';
            void wrap.offsetWidth;
            wrap.classList.add('won');
            fanfare();
            celebrate();

            addChip(result.associate);
            // Out of this round is over once this prize lands: their tickets go back in.
            sittingOut = '';
            remember();

            spinning = false;
            showPool();
            var more = ticketsLeft() > 0;
            go.disabled = !more;
            go.textContent = more ? '🎲 Draw another' : 'Everyone has been drawn';
            if (more) go.focus();
        }

        next();
    }

    // ============================================
    // WINNERS SO FAR
    // ============================================

    // Only winners are ever on screen. Anybody taken out simply disappears, so
    // a screenshot of the list shows who won and nothing else.
    function addChip(name) {
        var chip = document.createElement('li');
        chip.setAttribute('data-name', name);
        var text = document.createElement('span');
        text.textContent = '🏆 ' + name;
        var skip = document.createElement('button');
        skip.type = 'button';
        skip.className = 'skip';
        skip.textContent = '×';
        skip.title = 'Take ' + name + ' out';
        skip.setAttribute('aria-label', 'Take ' + name + ' out');
        skip.addEventListener('click', function () { openChoice(chip); });
        chip.appendChild(text);
        chip.appendChild(skip);
        winnersEl.appendChild(chip);
        return chip;
    }

    function clearTicketIf(name) {
        if (onTicket !== name) return;
        wrap.classList.remove('won');
        label.textContent = 'Nobody left in the bowl';
        setName('?', false);
        count.textContent = '';
        wonWith.textContent = '';
        nameEl.removeAttribute('title');
        onTicket = '';
    }

    // Either way out: the chip goes, the address forgets them as a winner,
    // and the next name drawn goes on the end of the list.
    function takeOut(chip, name) {
        winnersEl.removeChild(chip);
        remember();
        if (ticketsLeft() > 0) {
            draw();
            return;
        }
        sittingOut = '';
        clearTicketIf(name);
        showPool();
        go.disabled = ticketsLeft() === 0;
        go.textContent = winnersEl.children.length ? '🎲 Draw another' : '🎲 Draw a winner';
    }

    // Out of the raffle: not here, or doesn't qualify. They stay in drawn, so
    // they stay out of the bowl for the rest of the sitting.
    function strikeOff(chip) {
        if (spinning) return;
        var name = chip.getAttribute('data-name');
        if (outOfRaffle.indexOf(name) === -1) outOfRaffle.push(name);
        takeOut(chip, name);
    }

    // Out of this round: the next prize is drawn without them, and once it
    // lands their tickets go back in the bowl for the prizes after it.
    function outThisRound(chip) {
        if (spinning) return;
        var name = chip.getAttribute('data-name');
        if (drawn.indexOf(name) > -1) drawn.splice(drawn.indexOf(name), 1);
        sittingOut = name;
        takeOut(chip, name);
    }

    function closeChoice() {
        if (!choosing) return;
        var menu = choosing.querySelector('.choice');
        if (menu) choosing.removeChild(menu);
        choosing.classList.remove('choosing');
        choosing = null;
    }

    function option(text, hint, act) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = text;
        var small = document.createElement('small');
        small.textContent = hint;
        button.appendChild(small);
        button.addEventListener('click', function () { closeChoice(); act(); });
        return button;
    }

    // The x asks which way out. A second click on it closes the choice.
    function openChoice(chip) {
        if (spinning) return;
        var wasOpen = choosing === chip;
        closeChoice();
        if (wasOpen) return;
        var menu = document.createElement('div');
        menu.className = 'choice';
        menu.appendChild(option('Out of this round', 'Tickets go back in the bowl for later', function () { outThisRound(chip); }));
        menu.appendChild(option('Out of the raffle', 'Not here, or doesn\'t qualify', function () { strikeOff(chip); }));
        chip.appendChild(menu);
        chip.classList.add('choosing');
        choosing = chip;
        menu.firstChild.focus();
    }

    // ============================================
    // THE SITTING, IN THE ADDRESS
    // ============================================

    // The winners in order, and who is out of the raffle, ride in the address
    // so a refresh in the middle of the meeting picks up where it left off.
    // They are scrambled (?sitting=...) because the address bar shows up in a
    // screenshot and nobody should read who was taken out. Plain ?won= and
    // ?out= names still work for a hand-made link, and get scrambled on load.
    function packSitting(sitting) {
        return window.btoa(unescape(encodeURIComponent(JSON.stringify(sitting))))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function unpackSitting(packed) {
        try {
            var text = decodeURIComponent(escape(window.atob(String(packed).replace(/-/g, '+').replace(/_/g, '/'))));
            var sitting = JSON.parse(text);
            return sitting && typeof sitting === 'object' ? sitting : null;
        } catch (e) {
            return null;
        }
    }

    function remember() {
        if (!monthKey || !window.history || !window.history.replaceState) return;
        var won = Array.prototype.map.call(winnersEl.children, function (chip) { return chip.getAttribute('data-name'); });
        var params = new URLSearchParams();
        params.set('month', monthKey);
        if (won.length || outOfRaffle.length) params.set('sitting', packSitting({ won: won, out: outOfRaffle }));
        try {
            window.history.replaceState(null, '', window.location.pathname + '?' + params.toString());
        } catch (e) { /* the draw works the same without it */ }
    }

    // Names are matched to the bowl ignoring case. A name with no tickets
    // this month is passed over rather than guessed at.
    function restore() {
        var inBowl = {};
        contest().buildLeaderboard(monthData).forEach(function (row) {
            inBowl[row.associate.toLowerCase()] = row.associate;
        });
        var params = new URLSearchParams(window.location.search);
        var sitting = unpackSitting(params.get('sitting') || '') || {};
        var won = params.getAll('won').concat(Array.isArray(sitting.won) ? sitting.won : []);
        var out = params.getAll('out').concat(Array.isArray(sitting.out) ? sitting.out : []);
        function known(value) {
            var name = inBowl[String(value).trim().toLowerCase()];
            return name && drawn.indexOf(name) === -1 ? name : '';
        }
        out.forEach(function (value) {
            var name = known(value);
            if (!name) return;
            drawn.push(name);
            outOfRaffle.push(name);
        });
        won.forEach(function (value) {
            var name = known(value);
            if (!name) return;
            drawn.push(name);
            addChip(name);
        });
        remember();
    }

    go.addEventListener('click', function () { draw(); });

    // A click anywhere off the open choice closes it.
    document.addEventListener('click', function (event) {
        if (choosing && !choosing.contains(event.target)) closeChoice();
    });

    // Space or Enter draws, so nobody has to aim a mouse while sharing a screen.
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') { closeChoice(); return; }
        if (event.key !== ' ' && event.key !== 'Enter') return;
        // Buttons handle their own keys, so Enter on an × is one strike-off, not two draws.
        if (event.target && event.target.closest && event.target.closest('button')) return;
        event.preventDefault();
        draw();
    });

    // ============================================
    // START
    // ============================================

    function fail(message) {
        pool.textContent = message;
        label.textContent = 'Not quite yet';
        setName('🔒', false);
        go.disabled = true;
    }

    function loadFirstWithTickets(keys) {
        var key = keys[0];
        return fetchMonth(key).then(function (month) {
            var tickets = contest().computeEntries(month).length;
            if (!tickets && keys.length > 1) return loadFirstWithTickets(keys.slice(1));
            return { key: key, month: month };
        });
    }

    function start() {
        if (!contest()) { fail('The raffle could not load. Refresh the page to try again.'); return; }
        loadFirstWithTickets(monthsToTry()).then(function (found) {
            monthData = found.month;
            monthKey = found.key;
            title.textContent = labelOf(found.key);
            document.title = labelOf(found.key) + ' Raffle';
            restore();
            showPool();
            setName('?', false);
            go.disabled = ticketsLeft() === 0;
            if (drawn.length) go.textContent = go.disabled ? 'Everyone has been drawn' : '🎲 Draw another';
            if (!go.disabled) go.focus();
        }).catch(function (error) {
            if (error && (error.status === 401 || error.status === 403)) {
                fail('Open this link on the computer you use the Coaching Tool on.');
            } else {
                fail('Could not reach the tickets. Check the connection and refresh.');
            }
        });
    }

    window.DevCoachModules = window.DevCoachModules || {};
    var script = document.createElement('script');
    // The module is cached hard by URL, so a fresh key makes sure the draw
    // always runs today's rules.
    script.src = 'modules/contest.module.js?v=' + Date.now();
    script.onload = start;
    script.onerror = function () { fail('The raffle could not load. Refresh the page to try again.'); };
    document.head.appendChild(script);
    setName('?', false);
})();
</script>
</body>
</html>
